name: Soundy
options:
  bundleIdPrefix: space.soundy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "2.6.6"
    CURRENT_PROJECT_VERSION: "266"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: NO
targets:
  Soundy:
    type: application
    platform: iOS
    sources:
      - path: Soundy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.soundy.app
        PRODUCT_NAME: Soundy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Soundy/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
